<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 50 960 215" width="960" height="215">
  <defs>
    <!-- Golden Egg Gradients -->
    <radialGradient id="compactEggGrad1" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="25%" stop-color="#fed75b"/>
      <stop offset="70%" stop-color="#e8a317"/>
      <stop offset="100%" stop-color="#c48107"/>
    </radialGradient>
    <radialGradient id="compactEggGrad2" cx="35%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#fff8cc"/>
      <stop offset="25%" stop-color="#fed75b"/>
      <stop offset="70%" stop-color="#e8a317"/>
      <stop offset="100%" stop-color="#b87502"/>
    </radialGradient>
    <radialGradient id="compactEggGrad3" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="25%" stop-color="#fed75b"/>
      <stop offset="70%" stop-color="#e8a317"/>
      <stop offset="100%" stop-color="#c48107"/>
    </radialGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="compactLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Nest Stroke Gradient -->
    <linearGradient id="compactNestGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d3562"/>
      <stop offset="50%" stop-color="#092546"/>
      <stop offset="100%" stop-color="#05172d"/>
    </linearGradient>
    <linearGradient id="compactNestGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b4d84"/>
      <stop offset="100%" stop-color="#0a2a50"/>
    </linearGradient>

    <filter id="compactEggShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#05172d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left Logo Mark Group: Nest with Golden Eggs & Sprout -->
  <g transform="translate(10, 15)">
    <!-- Left Egg (FD) -->
    <g transform="translate(110, 125) rotate(-12) scale(0.95)" filter="url(#compactEggShadow)">
      <path d="M 0,-48 C 28,-48 38,18 36,44 C 34,64 22,78 0,78 C -22,78 -34,64 -36,44 C -38,18 -28,-48 0,-48 Z" fill="url(#compactEggGrad1)"/>
      <text x="0" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#082548" text-anchor="middle" letter-spacing="-1">FD</text>
    </g>

    <!-- Right Egg (Bar Chart) -->
    <g transform="translate(250, 130) rotate(14) scale(0.95)" filter="url(#compactEggShadow)">
      <path d="M 0,-48 C 28,-48 38,18 36,44 C 34,64 22,78 0,78 C -22,78 -34,64 -36,44 C -38,18 -28,-48 0,-48 Z" fill="url(#compactEggGrad3)"/>
      <g transform="translate(-16, 2) scale(1.1)" fill="#082548">
        <rect x="0" y="16" width="7" height="12" rx="1.5"/>
        <rect x="11" y="8" width="7" height="20" rx="1.5"/>
        <rect x="22" y="0" width="7" height="28" rx="1.5"/>
      </g>
    </g>

    <!-- Center Egg (Bank Pillars) -->
    <g transform="translate(178, 102) scale(1.08)" filter="url(#compactEggShadow)">
      <path d="M 0,-52 C 30,-52 42,20 40,48 C 38,70 24,84 0,84 C -24,84 -38,70 -40,48 C -42,20 -30,-52 0,-52 Z" fill="url(#compactEggGrad2)"/>
      <g transform="translate(0, 16) scale(1.15)" fill="#082548">
        <path d="M 0,-24 L 20,-12 L -20,-12 Z"/>
        <rect x="-20" y="-10" width="40" height="3" rx="0.5"/>
        <rect x="-17" y="-5" width="5" height="18" rx="1"/>
        <rect x="-7" y="-5" width="5" height="18" rx="1"/>
        <rect x="2" y="-5" width="5" height="18" rx="1"/>
        <rect x="12" y="-5" width="5" height="18" rx="1"/>
        <rect x="-21" y="14" width="42" height="4" rx="1"/>
      </g>
    </g>

    <!-- Green Leaves (Sprouting from the right nest rim) -->
    <g transform="translate(268, 88)">
      <path d="M 12,28 C 14,-2 48,-18 56,-32 C 58,-14 48,16 28,26 Z" fill="url(#compactLeafGrad)"/>
      <path d="M 22,28 C 32,16 62,18 72,12 C 70,26 50,38 30,34 Z" fill="url(#compactLeafGrad)"/>
    </g>

    <!-- Stylized Blue Nest Sweeps -->
    <path d="M 58,150 C 72,130 110,120 180,120 C 250,120 286,134 300,154 C 290,140 240,128 178,128 C 108,128 72,138 58,150 Z" fill="#071e38" opacity="0.6"/>
    <path d="M 40,138 C 30,175 62,242 176,242 C 290,242 322,175 312,138 C 302,128 292,142 292,154 C 282,216 248,228 176,228 C 98,228 72,214 62,154 C 62,142 50,130 40,138 Z" fill="url(#compactNestGrad1)"/>
    <path d="M 46,146 C 40,178 72,230 176,230 C 274,230 306,180 304,146 C 300,166 268,216 176,216 C 88,216 54,172 46,146 Z" fill="url(#compactNestGrad2)"/>
    <path d="M 64,176 C 86,232 140,246 186,246 C 240,246 280,224 294,188 C 282,216 236,236 186,236 C 136,236 84,218 64,176 Z" fill="#2563eb"/>
  </g>

  <!-- Typography Group: YieldNest.online (Bold, Clear, Readable) -->
  <g transform="translate(355, 36)">
    <!-- "Yield" (Deep Navy) -->
    <text x="0" y="145" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="132" font-weight="900" fill="#082548" letter-spacing="-2.5px">Yield</text>
    
    <!-- "Nest" (Vibrant Emerald Green) -->
    <text x="306" y="145" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="132" font-weight="900" fill="#00875a" letter-spacing="-2.5px">Nest</text>

    <!-- ".online" (High-visibility accent badge style) -->
    <text x="316" y="196" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#0d3b66" letter-spacing="-0.5px">.online</text>
  </g>
</svg>
